services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: studytrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - studytrack-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studytrack"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [studytrack-net]

  api:
    build:
      context: .
      dockerfile: studytrack-api.dockerfile
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=studytrack;Username=postgres;Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    networks: [studytrack-net]

networks:
  studytrack-net:

volumes:
  studytrack-data: