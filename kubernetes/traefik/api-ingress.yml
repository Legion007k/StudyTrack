apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studytrack-api
  namespace: studytrack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: studytrack.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studytrack-api
                port:
                  number: 8080
