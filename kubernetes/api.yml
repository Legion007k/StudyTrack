apiVersion: apps/v1
kind: Deployment
metadata:
  name: studytrack-api
  namespace: studytrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studytrack-api
  template:
    metadata:
      labels:
        app: studytrack-api
    spec:
      containers:
        - name: api
          image: localhost/studytrack-api:dev
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 100m          
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: studytrack-db-credentials
                  key: ConnectionStrings__DefaultConnection
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: studytrack-api
  namespace: studytrack
  labels:
    app: studytrack-api
spec:
  type: NodePort
  selector:
    app: studytrack-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
